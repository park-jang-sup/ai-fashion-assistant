name: ai_fashion_assistant
description: "AI Fashion Assistant App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  firebase_core: ^3.10.1
  cloud_firestore: ^5.6.3
  firebase_storage: ^12.4.1
  image_picker: ^1.1.2
  google_generative_ai: ^0.4.3
  http: ^1.2.2
  firebase_auth: ^5.5.3
  firebase_app_check: ^0.3.2+3
  crypto: ^3.0.7
  image_background_remover: ^2.0.0
  path_provider: ^2.1.6
  image_cropper: ^12.2.1
  table_calendar: ^3.1.2
  intl: ^0.20.2
  image: ^4.1.2
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # [스파이크 전용] 온디바이스 임베딩 검증용 모델. 스파이크 종료 시
  # assets/spike_models/ 디렉토리와 이 등록 전부 제거할 것.
  assets:
    - assets/spike_models/efficientnet_lite0_feature_vector.tflite
