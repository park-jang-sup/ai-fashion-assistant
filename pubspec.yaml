name: ai_fashion_assistant
description: "AI Fashion Assistant App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  firebase_core: ^3.10.1
  cloud_firestore: ^5.6.3
  firebase_storage: ^12.4.1
  image_picker: ^1.1.2
  google_generative_ai: ^0.4.3
  http: ^1.2.2
  firebase_auth: ^5.5.3
  firebase_app_check: ^0.3.2+3
  # 5.4.1부터 stream()(스트리밍 Callable) 지원. 6.x는 firebase_core 4.x
  # 세대와 짝이라(펍 BoM 기준) 올리면 core/firestore/auth/storage/app_check
  # 전부 메이저 업그레이드가 딸려온다 — A-1은 프록시 추가만이 목적이므로
  # 지금 세대(firebase_core ^3.10.1)에 맞는 5.x로 고정한다.
  cloud_functions: ^5.4.1
  crypto: ^3.0.7
  image_background_remover: ^2.0.0
  path_provider: ^2.1.6
  image_cropper: ^12.2.1
  table_calendar: ^3.1.2
  intl: ^0.20.2
  image: ^4.1.2
  # 배경제거 ONNX→TFLite 교체 후보용. release 안정성 검증됨(스파이크 이력은
  # docs/tflite_background_removal_spike_notes.md 참조).
  tflite_flutter: ^0.12.1
  flutter_local_notifications: ^17.2.3
  workmanager: ^0.9.0
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
